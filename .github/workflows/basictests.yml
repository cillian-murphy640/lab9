# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main", "test"]
  pull_request:
    branches: [ "main", "test"]

  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  lab9-basic-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        
      - name: Run and verify output
        run: |
          OUTPUT=$(python3 validate-data.py "pearse mccarthy" "0831122334")
          echo "Output: $OUTPUT"
          [ "$OUTPUT" = "PASS" ] || { echo "Expected PASS"; exit 1; }

          OUTPUT=$(python3 validate-data.py "pearse mccarthy" "08311223344")
          echo "Output: $OUTPUT"
          [ "$OUTPUT" = "FAIL" ] || { echo "Expected FAIL"; exit 1; }

          OUTPUT=$(python3 validate-data.py "pearseT mccarthy" "0831122334")
          echo "Output: $OUTPUT"
          [ "$OUTPUT" = "FAIL" ] || { echo "Expected FAIL"; exit 1; }
